name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.3
        run: |
          curl -L https://swiftlang.github.io/swiftly/swiftly-install.sh | bash
          swiftly install 6.3
      - run: swift test --parallel
